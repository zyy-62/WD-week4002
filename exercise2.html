<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise2 navigator object</title>
</head>
<body>
    <h2>Navigator Object Demo</h2>
    <script>
        let browserInfo = navigator.userAgent;
        document.write("<p>Browser userAgent: " + browserInfo + "</p>");
        document.write("<p>Platform: " + navigator.platform + "</p>");
    </script>
</body>
</html>
